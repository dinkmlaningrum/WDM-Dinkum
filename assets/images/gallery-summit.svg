<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="summitSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042f2e"/>
      <stop offset="50%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#115e59"/>
    </linearGradient>
    <linearGradient id="globeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#summitSky)"/>

  <!-- Geometric Circuit / Global Network Lines -->
  <g stroke="#2dd4bf" stroke-width="1.5" opacity="0.35" fill="none">
    <circle cx="400" cy="270" r="160"/>
    <circle cx="400" cy="270" r="120"/>
    <circle cx="400" cy="270" r="80"/>
    <line x1="240" y1="270" x2="560" y2="270"/>
    <ellipse cx="400" cy="270" rx="160" ry="60"/>
    <ellipse cx="400" cy="270" rx="60" ry="160"/>
    <line x1="100" y1="120" x2="280" y2="210"/>
    <line x1="700" y1="140" x2="520" y2="220"/>
  </g>

  <!-- Node Dots -->
  <circle cx="280" cy="210" r="6" fill="#fbbf24"/>
  <circle cx="520" cy="220" r="6" fill="#fbbf24"/>
  <circle cx="400" cy="110" r="7" fill="#fef08a"/>
  <circle cx="400" cy="430" r="7" fill="#fef08a"/>
  <circle cx="240" cy="270" r="6" fill="#38bdf8"/>
  <circle cx="560" cy="270" r="6" fill="#38bdf8"/>

  <!-- Conference Stage & Podium -->
  <polygon points="260,370 540,370 590,480 210,480" fill="#0f172a" opacity="0.95"/>
  <line x1="260" y1="370" x2="540" y2="370" stroke="#2dd4bf" stroke-width="3"/>

  <!-- Podium Center -->
  <rect x="360" y="320" width="80" height="90" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <circle cx="400" cy="355" r="18" fill="#0f766e"/>
  <text x="400" y="361" font-family="'Outfit', sans-serif" font-weight="800" font-size="14" fill="#ffffff" text-anchor="middle">UPM</text>

  <!-- International Delegate Badges Floating -->
  <g transform="translate(130, 240)">
    <rect x="0" y="0" width="130" height="70" rx="10" fill="#0f172a" stroke="#2dd4bf" stroke-width="1.5"/>
    <text x="15" y="25" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#2dd4bf">DELEGATE</text>
    <text x="15" y="45" font-family="'Outfit', sans-serif" font-size="13" font-weight="700" fill="#ffffff">INDONESIA</text>
    <circle cx="105" cy="35" r="14" fill="#134e4a"/>
    <text x="105" y="40" font-size="14" text-anchor="middle">🇮🇩</text>
  </g>

  <g transform="translate(540, 240)">
    <rect x="0" y="0" width="130" height="70" rx="10" fill="#0f172a" stroke="#2dd4bf" stroke-width="1.5"/>
    <text x="15" y="25" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#2dd4bf">HOST NATION</text>
    <text x="15" y="45" font-family="'Outfit', sans-serif" font-size="13" font-weight="700" fill="#ffffff">MALAYSIA</text>
    <circle cx="105" cy="35" r="14" fill="#134e4a"/>
    <text x="105" y="40" font-size="14" text-anchor="middle">🇲🇾</text>
  </g>

  <!-- Top Event Title Banner Overlay -->
  <rect x="40" y="35" width="720" height="75" rx="14" fill="#042f2e" fill-opacity="0.9" stroke="#14b8a6" stroke-width="1.5"/>
  <text x="70" y="65" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="13" fill="#2dd4bf" letter-spacing="1.5">INTERNATIONAL FORUM • UNIVERSITI PUTRA MALAYSIA</text>
  <text x="70" y="93" font-family="'Outfit', sans-serif" font-weight="700" font-size="22" fill="#ffffff">Global Student Summit 3.0 (Malaysia)</text>
  <rect x="630" y="52" width="110" height="36" rx="18" fill="#0f766e"/>
  <text x="685" y="75" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#ffffff" text-anchor="middle">Nov-Des 2024</text>
</svg>
