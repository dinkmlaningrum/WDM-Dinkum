<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="commBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#commBg)"/>

  <!-- Warm Community Sunburst / Radial -->
  <circle cx="400" cy="270" r="190" fill="#10b981" opacity="0.3"/>
  <circle cx="400" cy="270" r="140" fill="#34d399" opacity="0.25"/>

  <!-- Hands Holding Heart Illustration Center -->
  <g transform="translate(400, 260)">
    <!-- Heart Center -->
    <path d="M0,15 C-45,-40 -80,10 0,75 C80,10 45,-40 0,15 Z" fill="url(#heartGrad)"/>

    <!-- Left Hand Cradle -->
    <path d="M-130,80 C-100,50 -70,55 -30,80 C-5,95 20,110 40,110 C-10,140 -80,130 -130,80 Z" fill="#fef08a" opacity="0.9"/>

    <!-- Right Hand Cradle -->
    <path d="M130,80 C100,50 70,55 30,80 C5,95 -20,110 -40,110 C10,140 80,130 130,80 Z" fill="#fde047" opacity="0.9"/>

    <circle cx="0" cy="20" r="28" fill="#ffffff" opacity="0.2"/>
    <text x="0" y="27" font-size="24" text-anchor="middle">🤝</text>
  </g>

  <!-- Community Impact Badges -->
  <g transform="translate(100, 260)">
    <rect x="0" y="0" width="160" height="85" rx="12" fill="#064e3b" stroke="#34d399" stroke-width="1.5"/>
    <text x="20" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#6ee7b7">DIVISI SOSIAL</text>
    <text x="20" y="52" font-family="'Outfit', sans-serif" font-size="14" font-weight="700" fill="#ffffff">Pengabdian</text>
    <text x="20" y="70" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#a7f3d0">Masyarakat & Baksos</text>
  </g>

  <g transform="translate(540, 260)">
    <rect x="0" y="0" width="160" height="85" rx="12" fill="#064e3b" stroke="#34d399" stroke-width="1.5"/>
    <text x="20" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#6ee7b7">SOLIDARITAS</text>
    <text x="20" y="52" font-family="'Outfit', sans-serif" font-size="14" font-weight="700" fill="#ffffff">Peduli Kampus</text>
    <text x="20" y="70" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#a7f3d0">Integrasi Mahasiswa</text>
  </g>

  <!-- Top Event Title Banner Overlay -->
  <rect x="40" y="35" width="720" height="75" rx="14" fill="#064e3b" fill-opacity="0.92" stroke="#34d399" stroke-width="1.5"/>
  <text x="70" y="65" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="13" fill="#6ee7b7" letter-spacing="1.5">SOCIAL & COMMUNITY DIVISION • JBS STUDENT COUNCIL</text>
  <text x="70" y="93" font-family="'Outfit', sans-serif" font-weight="700" font-size="21" fill="#ffffff">Aksi Sosial & Pengabdian Komunitas Mahasiswa</text>
  <rect x="630" y="52" width="110" height="36" rx="18" fill="#047857"/>
  <text x="685" y="75" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#ffffff" text-anchor="middle">2024–2025</text>
</svg>
