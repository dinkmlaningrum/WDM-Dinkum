<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="stageBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#180d2b"/>
      <stop offset="50%" stop-color="#2d124d"/>
      <stop offset="100%" stop-color="#0f071a"/>
    </linearGradient>
    <linearGradient id="spotlightLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="spotlightRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="guitarBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="50%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <linearGradient id="flagRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#stageBg)"/>

  <!-- Spotlights -->
  <polygon points="120,0 20,500 380,500" fill="url(#spotlightLeft)"/>
  <polygon points="680,0 420,500 780,500" fill="url(#spotlightRight)"/>

  <!-- Stage Planks -->
  <polygon points="0,410 800,410 800,500 0,500" fill="#1e1528"/>
  <line x1="0" y1="410" x2="800" y2="410" stroke="#fbbf24" stroke-width="2" opacity="0.6"/>
  <line x1="160" y1="410" x2="120" y2="500" stroke="#2d1f3b" stroke-width="2"/>
  <line x1="320" y1="410" x2="280" y2="500" stroke="#2d1f3b" stroke-width="2"/>
  <line x1="480" y1="410" x2="520" y2="500" stroke="#2d1f3b" stroke-width="2"/>
  <line x1="640" y1="410" x2="680" y2="500" stroke="#2d1f3b" stroke-width="2"/>

  <!-- Acoustic Guitar Illustration Center -->
  <g transform="translate(350, 160)">
    <!-- Guitar Neck -->
    <rect x="42" y="0" width="16" height="150" fill="#d97706" rx="3"/>
    <!-- Headstock -->
    <polygon points="40,0 60,0 58,-35 42,-35" fill="#92400e"/>
    <!-- Tuning Pegs -->
    <circle cx="37" cy="-28" r="3" fill="#cbd5e1"/>
    <circle cx="37" cy="-18" r="3" fill="#cbd5e1"/>
    <circle cx="63" cy="-28" r="3" fill="#cbd5e1"/>
    <circle cx="63" cy="-18" r="3" fill="#cbd5e1"/>
    <!-- Frets -->
    <line x1="42" y1="30" x2="58" y2="30" stroke="#fef08a" stroke-width="1.5"/>
    <line x1="42" y1="60" x2="58" y2="60" stroke="#fef08a" stroke-width="1.5"/>
    <line x1="42" y1="90" x2="58" y2="90" stroke="#fef08a" stroke-width="1.5"/>
    <line x1="42" y1="120" x2="58" y2="120" stroke="#fef08a" stroke-width="1.5"/>
    <!-- Guitar Body Upper & Lower Bout -->
    <circle cx="50" cy="180" r="42" fill="url(#guitarBody)"/>
    <circle cx="50" cy="245" r="58" fill="url(#guitarBody)"/>
    <!-- Sound Hole -->
    <circle cx="50" cy="195" r="20" fill="#0f071a"/>
    <circle cx="50" cy="195" r="23" fill="none" stroke="#fbbf24" stroke-width="2"/>
    <!-- Bridge -->
    <rect x="32" y="260" width="36" height="10" rx="3" fill="#1c1917"/>
    <!-- Strings -->
    <line x1="46" y1="-30" x2="46" y2="265" stroke="#f8fafc" stroke-width="1" opacity="0.8"/>
    <line x1="50" y1="-30" x2="50" y2="265" stroke="#f8fafc" stroke-width="1" opacity="0.8"/>
    <line x1="54" y1="-30" x2="54" y2="265" stroke="#f8fafc" stroke-width="1" opacity="0.8"/>
  </g>

  <!-- Microphone Stand -->
  <line x1="280" y1="220" x2="280" y2="420" stroke="#cbd5e1" stroke-width="4"/>
  <polygon points="260,420 300,420 280,410" fill="#94a3b8"/>
  <ellipse cx="280" cy="215" rx="8" ry="14" fill="#64748b"/>
  <circle cx="280" cy="208" r="7" fill="#cbd5e1"/>

  <!-- Music Notes floating -->
  <text x="210" y="240" font-size="28" fill="#fbbf24" opacity="0.85">♪</text>
  <text x="540" y="220" font-size="34" fill="#f43f5e" opacity="0.85">♫</text>
  <text x="580" y="300" font-size="26" fill="#a855f7" opacity="0.8">♩</text>
  <text x="180" y="310" font-size="32" fill="#38bdf8" opacity="0.8">♬</text>

  <!-- Indonesian Independence Ribbon 17 Agustus -->
  <g transform="translate(620, 20)">
    <rect x="0" y="0" width="130" height="20" rx="4" fill="url(#flagRed)"/>
    <rect x="0" y="20" width="130" height="20" rx="4" fill="#ffffff"/>
    <text x="65" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="12" fill="#0f172a" text-anchor="middle">17 AGUSTUS</text>
  </g>

  <!-- Top Event Title Banner Overlay -->
  <rect x="40" y="35" width="560" height="75" rx="14" fill="#0f172a" fill-opacity="0.88" stroke="#334155" stroke-width="1.5"/>
  <text x="70" y="65" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="13" fill="#f43f5e" letter-spacing="1.5">SENI & KEBUDAYAAN • PIGIJO & TAMAN SUROPATI</text>
  <text x="70" y="93" font-family="'Outfit', sans-serif" font-weight="700" font-size="21" fill="#ffffff">Mini Acoustic Concert & HUT RI Ke-79</text>
</svg>
