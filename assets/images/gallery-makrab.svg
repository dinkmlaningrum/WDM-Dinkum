<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="nightSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="60%" stop-color="#141e33"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="fireGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="40%" stop-color="#f97316"/>
      <stop offset="85%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <radialGradient id="fireGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <!-- Sky Background -->
  <rect width="800" height="500" fill="url(#nightSky)"/>

  <!-- Stars -->
  <circle cx="80" cy="70" r="1.5" fill="#fff" opacity="0.8"/>
  <circle cx="150" cy="110" r="2" fill="#fef08a" opacity="0.9"/>
  <circle cx="240" cy="60" r="1.5" fill="#fff" opacity="0.7"/>
  <circle cx="320" cy="95" r="2" fill="#fff" opacity="0.8"/>
  <circle cx="480" cy="75" r="1.5" fill="#fff" opacity="0.9"/>
  <circle cx="620" cy="85" r="2.5" fill="#fef08a" opacity="0.9"/>
  <circle cx="710" cy="120" r="1.5" fill="#fff" opacity="0.7"/>
  <circle cx="670" cy="50" r="2" fill="#fff" opacity="0.8"/>

  <!-- Subtle Mountain Silhouette -->
  <path d="M0 380 L180 280 L340 370 L520 250 L680 340 L800 290 L800 500 L0 500 Z" fill="#0f172a" opacity="0.7"/>
  <path d="M0 400 L220 330 L400 410 L600 320 L800 390 L800 500 L0 500 Z" fill="#0b1120"/>

  <!-- Camping Tents Left & Right -->
  <!-- Left Tent -->
  <polygon points="120,440 180,330 240,440" fill="url(#tentGrad)"/>
  <polygon points="180,330 240,440 200,440 180,370" fill="#1e40af"/>
  <polygon points="180,370 200,440 160,440" fill="#0f172a" opacity="0.6"/>

  <!-- Right Tent -->
  <polygon points="560,440 620,330 680,440" fill="#f59e0b"/>
  <polygon points="620,330 680,440 640,440 620,370" fill="#d97706"/>
  <polygon points="620,370 640,440 600,440" fill="#0f172a" opacity="0.6"/>

  <!-- Fire Ambient Glow -->
  <circle cx="400" cy="380" r="170" fill="url(#fireGlow)"/>

  <!-- Fire Logs -->
  <rect x="340" y="420" width="120" height="18" rx="8" fill="#78350f" transform="rotate(-15 400 420)"/>
  <rect x="340" y="420" width="120" height="18" rx="8" fill="#92400e" transform="rotate(15 400 420)"/>

  <!-- Campfire Flames -->
  <path d="M400 260 C420 310, 445 340, 435 390 C430 410, 415 425, 400 425 C385 425, 370 410, 365 390 C355 340, 380 310, 400 260 Z" fill="url(#fireGrad)"/>
  <path d="M400 300 C412 330, 425 350, 420 385 C417 400, 408 412, 400 412 C392 412, 383 400, 380 385 C375 350, 388 330, 400 300 Z" fill="#fef08a"/>

  <!-- Sparks -->
  <circle cx="390" cy="240" r="3" fill="#fbbf24"/>
  <circle cx="415" cy="225" r="2.5" fill="#f97316"/>
  <circle cx="380" cy="205" r="2" fill="#fef08a"/>
  <circle cx="425" cy="190" r="2" fill="#fbbf24"/>

  <!-- Student Silhouettes around Campfire -->
  <circle cx="280" cy="390" r="16" fill="#1e293b"/>
  <path d="M260 440 C260 415, 270 405, 280 405 C290 405, 300 415, 300 440 Z" fill="#1e293b"/>

  <circle cx="330" cy="395" r="15" fill="#1e293b"/>
  <path d="M312 440 C312 418, 320 410, 330 410 C340 410, 348 418, 348 440 Z" fill="#1e293b"/>

  <circle cx="470" cy="395" r="15" fill="#1e293b"/>
  <path d="M452 440 C452 418, 460 410, 470 410 C480 410, 488 418, 488 440 Z" fill="#1e293b"/>

  <circle cx="520" cy="390" r="16" fill="#1e293b"/>
  <path d="M500 440 C500 415, 510 405, 520 405 C530 405, 540 415, 540 440 Z" fill="#1e293b"/>

  <!-- Top Event Title Banner Overlay -->
  <rect x="40" y="35" width="720" height="75" rx="14" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1.5"/>
  <text x="70" y="65" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="14" fill="#fbbf24" letter-spacing="1.5">DOKUMENTASI KEGIATAN MAHASISWA</text>
  <text x="70" y="93" font-family="'Outfit', sans-serif" font-weight="700" font-size="22" fill="#ffffff">Malam Keakraban (Makrab) 2024 • Jakarta Business School</text>
  <rect x="630" y="52" width="110" height="36" rx="18" fill="#1e3a8a"/>
  <text x="685" y="75" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#ffffff" text-anchor="middle">28-29 Nov 2024</text>
</svg>
